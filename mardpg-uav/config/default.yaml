environment:
  near_miss_band: 3.0
  uav_sense_radius: 1.0
  n_agents: 5
  v: 3.0
  dt: 0.1
  max_altitude: 60.0
  min_altitude: 0.0
  sensor_range: 10.0
  collision_radius: 0.5
  inter_uav_min_dist: 1.0
  max_delta_angle: 0.5236
  env_size: [100.0, 100.0, 60.0]
  max_steps_per_episode: 1500
  goal_threshold: 1.0
  goal_min_sep: 8.0
  neighbor_pos_scale: 20.0
  reward:
    alpha:    3.0
    lambda_col: 5.0
    sigma_col: 3.0
    sigma_col_uav: 1.5
    r_free:  0.1
    r_step: -1.0
    r_goal: 10.0
    r_collision_terminal: 30.0
    delta: [0.45, 0.30, 0.15, 0.10]
algorithm:
  device: cuda
  abort_if_cpu: false
  gamma:        0.99
  tau:          0.01
  lr_actor:     0.001
  lr_critic:    0.001
  lr_shared_actor: 0.002
  batch_size:   128
  seq_len:      80
  burn_in:      10
  replay_capacity: 300000
  update_freq: 50
  warmup_steps: 2000
  gradient_clip: 1.0
  shared_gradient_clip: 5.0
  n_episodes:   20000
  noise_std:    0.3
  noise_min:    0.05
  noise_decay:  0.9995
  noise_reboost: 0.15
  huber_beta: 10.0
  grad_steps_per_update: 25
  deterministic_cudnn: false
  eval_every: 100
  eval_episodes: 30
  eval_episodes_late: 50
  eval_episodes_late_threshold: 0.50
  promotion_min_episodes: 100
  promotion_consecutive_evals: 2
  promotion_fast_consecutive_evals: 2
  promotion_margin: 0.10
  save_replay_on_checkpoint: true
  replay_flush_frac_on_promotion: 0.0
  replay_flush_frac_on_obstacle_shift: 0.3
  twin_critic: false
  target_policy_noise: 0.0
  target_noise_clip: 0.2
  tail_pad: null
  q_divergence_warn: 15.0
network:
  fc_angle_units:  8
  fc_goal_units:   8
  actor_lstm_hidden: 128
  critic_lstm_hidden: 128

# ---------------------------------------------------------------------------
# Rendering / media logging.
#
# Every option below can also be overridden from the command line (see
# scripts/evaluate_multiagent.py --help). Nothing here affects training or the
# numeric evaluation metrics; it only controls whether/how the environment is
# visualised and where media is written. The same config works unchanged on a
# headless GCP VM and on a local desktop -- switch behaviour with the flags,
# not with code edits (set realtime_render:false on the VM, true locally).
# ---------------------------------------------------------------------------
render:
  enable_render:     true          # master switch for producing any media
  realtime_render:   false          # live interactive window (local desktops only)
  record_video:      true           # write an MP4 of the best episode per scene
  save_png:          true           # write publication-quality trajectory PNGs
  save_frames:       false          # also dump the individual video frames as PNGs
  frame_stride:      1              # when save_frames: keep every Nth frame
  video_fps:         20             # frames per second of the recorded MP4
  video_codec:       mp4v           # FourCC codec for the OpenCV writer (mp4v/avc1/XVID)
  render_backend:    auto           # auto | Agg (headless) | TkAgg/QtAgg (interactive)
  render_resolution: [1280, 960]    # [width, height] in pixels for rendered frames
  image_dpi:         200            # DPI for the static publication PNGs
  wandb_log_media:   true           # upload videos + images to Weights & Biases
  output_directory:  eval_results   # where all rendered media is written
