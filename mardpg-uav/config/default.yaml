environment:
  n_agents: 5
  v: 1.0                      # constant speed m/s (paper: fixed v)
  dt: 0.1
  max_altitude: 60.0
  min_altitude: 0.0
  sensor_range: 10.0
  collision_radius: 0.5       # R
  inter_uav_min_dist: 1.0     # 2R
  max_delta_angle: 0.5236     # pi/6 radians
  env_size: [100.0, 100.0, 60.0]
  max_steps_per_episode: 1500
  goal_threshold: 1.0

  # Obstacle generation
  scene_types: [1, 2, 3, 4]   # 1=square, 2=cylinder, 3=forest, 4=circular
  
  # Reward parameters (Eq 4)
  reward:
    alpha:    3.0
    lambda_col: 5.0
    sigma_col: 15.0            # RESTORED from paper
    r_free:  0.1
    r_step: -0.6
    delta: [0.45, 0.30, 0.15, 0.10]
    # NO r_goal, NO r_col hard penalty, NO r_sep

algorithm:
  device: cuda
  gamma:        0.99
  tau:          0.01
  lr_actor:     0.01           # paper: Adam lr=0.01
  lr_critic:    0.01
  batch_size:   128
  seq_len:      80             # paper: LSTM time step = 80
  burn_in:      10
  replay_capacity: 100000      # paper: buffer size 10^5
  update_freq:  100            # paper: sampled every 100 steps
  warmup_steps: 2000
  gradient_clip: 1.0
  n_episodes:   20000
  noise_std:    0.1
  noise_theta: 0.15
  noise_sigma: 0.20

network:
  conv_filters:    32
  fc_angle_units:  8
  fc_goal_units:   8
  actor_lstm_hidden: 128
  critic_lstm_hidden: 128
