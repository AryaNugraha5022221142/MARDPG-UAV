environment:
  n_agents: 5
  v_max: 3.0              # m/s — replaces uav_speed semantics
  tau_v: 0.3              # velocity tracking time constant (s)
  dt: 0.1                     # s (10Hz control frequency)
  max_altitude: 60.0          # meters
  min_altitude: 0.0
  sensor_range: 10.0          # meters
  collision_radius: 0.5       # R (inferred)
  inter_uav_min_dist: 1.0     # 2R
  action_bounds: [-3.0, 3.0]  # m/s
  
  # Obstacle generation
  scene_types: [1, 2, 3, 4]   # 1=square, 2=cylinder, 3=forest, 4=circular
  env_size: [50.0, 50.0, 60.0]  # x, y, z bounds
  
  # Episode settings
  max_steps_per_episode: 1500
  goal_threshold: 2.0         # meters to count as "reached"
  
  # Reward parameters (Eq 4)
  reward:
    alpha: 3.0
    lambda_col: 2.0       # Reduced from 5.0 to prevent severe trapping penalties
    sigma_col: 1.0
    lambda_sep: 1.0       # Reduced from 2.0 
    sigma_sep: 5.0
    r_free: 0.1
    r_step: -0.4
    delta: [0.40, 0.30, 0.10, 0.10, 0.10]
    r_goal: 30.0          
    r_col: 25.0           # CRITICAL fix

algorithm:
  device: cuda
  gamma: 0.99
  tau: 0.01
  lr_actor: 0.0001
  lr_critic: 0.0003
  batch_size: 128
  seq_len: 25
  burn_in: 12
  replay_capacity: 2000
  update_freq: 50           # FIX (Bug 4): Update every 50 steps, not 10 episodes
  grad_steps_per_update: 4  # FIX (Bug 4): Multiple gradient steps per update
  warmup_episodes: 300
  gradient_clip: 1.0
  n_episodes: 15000
  policy_noise: 0.10      # m/s (10% of v_max)
  noise_clip: 0.15        # m/s

  exploration:
    noise_std_start: 0.20  # 25% of v_max
    noise_std_end: 0.05  # 2% of v_max
    noise_anneal_steps: 3000000

network:
  shared:
    conv_filters: 32
    conv_kernel: 2
    fc_angle_units: 16
    fc_goal_units: 8
  actor:
    lstm_hidden: 128
  critic:
    fc1_units: 256
    lstm_hidden: 64
