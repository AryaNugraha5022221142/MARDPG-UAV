environment:
  n_agents: 5
  uav_speed: 3.0              # m/s (inferred from typical quadrotor sim)
  dt: 0.1                     # s (10Hz control frequency)
  max_altitude: 60.0          # meters
  min_altitude: 0.0
  sensor_range: 10.0          # meters
  collision_radius: 0.5       # R (inferred)
  inter_uav_min_dist: 1.0     # 2R
  action_bounds: [-0.5235987755982988, 0.5235987755982988]  # ±π/6 rad/s
  
  # Obstacle generation
  obstacle_density: 0.1       # 10% space occupancy
  scene_types: [1, 2, 3, 4]   # 1=square, 2=cylinder, 3=forest, 4=circular
  env_size: [50.0, 50.0, 60.0]  # x, y, z bounds
  
  # Episode settings
  max_steps_per_episode: 500
  goal_threshold: 2.0         # meters to count as "reached"
  
  # Reward parameters (Eq 4)
  reward:
    alpha: 3.0
    lambda_col: 5.0
    sigma_col: 10.0
    lambda_sep: 2.0
    sigma_sep: 5.0
    r_free: 0.1
    r_step: -0.4
    delta: [0.40, 0.30, 0.10, 0.10, 0.10]
    r_goal: 15.0
    r_col: 15.0

algorithm:
  gamma: 0.99
  tau: 0.01
  lr_actor: 0.0001
  lr_critic: 0.0003
  batch_size: 128
  seq_len: 50
  burn_in: 12
  replay_capacity: 2000
  update_freq: 10
  warmup_episodes: 300
  gradient_clip: 1.0
  n_episodes: 15000

  exploration:
    ou_kappa: 0.15
    noise_std_start: 0.25
    noise_std_end: 0.05
    noise_anneal_steps: 3000000

network:
  shared:
    conv_filters: 32
    conv_kernel: 2
    fc_angle_units: 16
    fc_goal_units: 8
  actor:
    lstm_hidden: 128
  critic:
    fc1_units: 256
    lstm_hidden: 64
