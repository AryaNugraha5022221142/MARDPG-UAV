environment:
  n_agents: 5
  v: 3.0                      # constant speed m/s (paper: fixed v)
  dt: 0.1
  max_altitude: 60.0
  min_altitude: 0.0
  sensor_range: 10.0
  collision_radius: 0.5       # R
  inter_uav_min_dist: 1.0     # 2R
  max_delta_angle: 0.5236     # pi/6 radians
  env_size: [100.0, 100.0, 60.0]
  max_steps_per_episode: 1500
  goal_threshold: 1.0
  goal_min_sep: 4.0           # [N-4] min goal-to-goal distance; must exceed
                              # 2*goal_threshold + inter_uav_min_dist (=3.0) so
                              # two agents cannot satisfy their goal thresholds
                              # while inside each other's collision radius.

  # Obstacle generation

  # Reward parameters (Eq 4)
  reward:
    alpha:    3.0
    lambda_col: 5.0
    sigma_col: 3.0             # ~1m warning band
    r_free:  0.1
    r_step: -1.0
    r_goal: 10.0               # terminal success anchor
    # [N-3] Terminal collision penalty, applied UNSCALED in uav_env.py
    # (reward -= this value), symmetric with the unscaled +r_goal anchor.
    # Effective weighted step cost is delta[3]*r_step = 0.10 * -1.0 = -0.10/step,
    # so undiscounted wandering for 1500 steps is ~-150; discounted (gamma=0.99)
    # it is ~-10, well above this penalty in magnitude => immediate death is
    # value-dominated. Huber (huber_beta) keeps the resulting TD errors out of
    # the permanent gradient-clipping regime.
    # NOTE: changing this value changes the MDP — requires training from scratch.
    r_collision_terminal: 30.0    # applied as reward -= this value (unscaled)
    delta: [0.45, 0.30, 0.15, 0.10]

algorithm:
  device: cuda
  gamma:        0.99
  tau:          0.01
  lr_actor:     0.001
  lr_critic:    0.001
  lr_shared_actor: 0.002
  batch_size:   128
  seq_len:      80
  burn_in:      10
  replay_capacity: 100000
  update_freq:  100
  warmup_steps: 2000
  gradient_clip: 1.0
  shared_gradient_clip: 5.0
  n_episodes:   20000
  noise_std:    0.3
  noise_min:    0.05
  noise_decay:  0.9995
  noise_reboost: 0.15          # [N-8] on promotion, sigma <- max(sigma, this).
                               # Counters the per-episode decay flooring sigma at
                               # 0.05 long before the later (harder) stages, which
                               # would otherwise be explored at ~10% action bound
                               # right when the distribution shift is largest.

  # ---- New (audit fixes) -------------------------------------------------
  huber_beta: 10.0             # [I1] Huber transition point for critic loss.
                               # TD errors below this behave as MSE/2;
                               # above it, per-element gradient is capped.
  grad_steps_per_update: 1     # [I4] raise to 2-4 on T4 if benchmark shows
                               # the env (CPU) dominates — converts idle GPU
                               # into sample efficiency without touching the
                               # data-collection rate.
  deterministic_cudnn: false   # [I4] true only for strict-repro debug runs;
                               # deterministic LSTM kernels are slow on GPU.
  eval_every: 200              # [I3] run a noise-free eval block every N
                               # in-stage episodes...
  eval_episodes: 50            # ...of this many episodes; promotion is
                               # decided on these stats, not noisy rollouts.
  promotion_min_episodes: 200  # minimum episodes in a stage before the
                               # first promotion eval.
  promotion_consecutive_evals: 2 # consecutive passing evals needed to promote
  save_replay_on_checkpoint: false  # [C3] replay is always saved on
                               # KeyboardInterrupt; enable this to also save
                               # it on periodic checkpoints (~100-300 MB).

network:
  fc_angle_units:  8
  fc_goal_units:   8
  actor_lstm_hidden: 128
  critic_lstm_hidden: 128