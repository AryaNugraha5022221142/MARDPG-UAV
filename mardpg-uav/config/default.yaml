environment:
  near_miss_band: 3.0          # [FIX5] metres; soft band for near-miss counting
  # [NO-COMM FIX] Other UAVs are sensed by the rangefinder as spheres of this
  # radius. Default = inter_uav_min_dist (1.0 m) so a neighbour's 2R safety
  # bubble is reliably detectable on a 25-beam sensor; lower toward
  # collision_radius (0.5) for a stricter, harder-to-sense test.
  uav_sense_radius: 1.0

  n_agents: 5
  v: 3.0                      # constant speed m/s (paper: fixed v)
  dt: 0.1
  max_altitude: 60.0
  min_altitude: 0.0
  sensor_range: 10.0
  collision_radius: 0.5       # R
  inter_uav_min_dist: 1.0     # 2R
  max_delta_angle: 0.5236     # pi/6 radians
  env_size: [100.0, 100.0, 60.0]
  max_steps_per_episode: 1500
  goal_threshold: 1.0
  goal_min_sep: 8.0

  # [N3-1] Local metric scale for body-frame neighbor positions (metres).
  # Neighbor displacements are expressed in the observer's body frame and
  # divided by this scale (then clipped to [-1,1]), instead of the old
  # arena-diagonal (~125 m) normalization that drove a 1 m separation to a
  # ~0.008 feature — below the lidar noise floor.
  neighbor_pos_scale: 20.0

  # Reward parameters (Eq 4)
  reward:
    alpha:    3.0
    lambda_col: 5.0
    sigma_col: 3.0             # ~1m warning band (obstacles)
    sigma_col_uav: 1.5         # [C1] wider inter-UAV band (~2m) for anticipatory avoidance
    r_free:  0.1
    r_step: -1.0
    r_goal: 10.0               # terminal success anchor
    # [N-3] Terminal collision penalty, applied UNSCALED in uav_env.py
    # (reward -= this value), symmetric with the unscaled +r_goal anchor.
    # Effective weighted step cost is delta[3]*r_step = 0.10 * -1.0 = -0.10/step,
    # so undiscounted wandering for 1500 steps is ~-150; discounted (gamma=0.99)
    # it is ~-10, well above this penalty in magnitude => immediate death is
    # value-dominated. Huber (huber_beta) keeps the resulting TD errors out of
    # the permanent gradient-clipping regime.
    # NOTE: changing this value changes the MDP — requires training from scratch.
    r_collision_terminal: 30.0    # applied as reward -= this value (unscaled)
    delta: [0.45, 0.30, 0.15, 0.10]

algorithm:
  device: cuda
  # [N4-4] Make CPU fallback fatal. The 2026-06-11 run silently executed on
  # CPU at 0.01-0.03 ep/s (ETA 330-450 h); stages 4-7 are 2.5-3.75x longer
  # per episode. Set true for any run you intend to take past stage 2.
  abort_if_cpu: false

  gamma:        0.99           # [B5] horizon ~100 steps. If stages 4-6 stall with
                               # high trapped_rate, the contingency is gamma->0.995,
                               # which rescales Q and changes the MDP (retrain from
                               # scratch). Do NOT change mid-curriculum.
                               # [N4 audit] Stage-1 evidence does NOT implicate
                               # gamma (dense r_trans carried the 150-400 step
                               # horizon fine). Trigger unchanged.
  tau:          0.01           # [B3] tuned at low replay ratio; if q_gap_signed
                               # warns persistently POSITIVE at grad_steps=8, try 0.005.
  lr_actor:     0.001
  lr_critic:    0.001
  lr_shared_actor: 0.002
  batch_size:   128
  seq_len:      80
  burn_in:      10
  replay_capacity: 300000      # [B2] was 100000 (~66-100 episodes at stage 6-7);
                               # 300k ~= 200-300 late-stage episodes. ~0.6 GB host
                               # RAM, zero GPU cost. Pairs with tail_pad churn (B1).
                               # [N4 audit] NOTE: at stage-1 episode lengths,
                               # tail_pad (89/episode) means ~20-30% of slots are
                               # pads; effective real-transition capacity ~230k.
                               # `Buf:` in the console counts slots, not real
                               # transitions. Working as designed — just don't
                               # misread the number.
  update_freq:  100
  warmup_steps: 2000
  gradient_clip: 1.0
  shared_gradient_clip: 5.0
  n_episodes:   20000
  noise_std:    0.3
  noise_min:    0.05
  noise_decay:  0.9995
  noise_reboost: 0.15          # [N-8] on promotion, sigma <- max(sigma, this).
                               # Counters the per-episode decay flooring sigma at
                               # 0.05 long before the later (harder) stages, which
                               # would otherwise be explored at ~10% action bound
                               # right when the distribution shift is largest.

  # ---- New (audit fixes) -------------------------------------------------
  huber_beta: 10.0

  # [N3-3] Raised 1 -> 8. update_freq=100 with 1 grad step gave a replay ratio
  # of ~0.01; DDPG-family baselines run 0.25-1.0. Run benchmark.py first; if the
  # env (CPU) dominates, this converts idle GPU into sample efficiency without
  # changing the data-collection rate. Watch critic_grad / q_mean for instability
  # as you raise it.
  # [N4 audit] Verified stable through stage 1: critic_grad settled ~0.2 vs
  # clip 1.0, no q oscillation. Keep at 8.
  grad_steps_per_update: 8

  deterministic_cudnn: false
  eval_every: 100
  eval_episodes: 30            # [C4] SE at n=30 ~ +-9pp; keep >= 25.
  # [N4-3] Stages whose success bar >= the threshold below use the larger
  # eval set. Rationale: at n=30, +-9pp around bars of 0.55-0.60 (stages 4-6)
  # causes pass/fail flapping that resets the consecutive-pass counter —
  # promotion latency easily misread as a learning stall. n=50 gives ~+-7pp;
  # the extra eval cost only applies where the gate is tight.
  eval_episodes_late: 50
  eval_episodes_late_threshold: 0.50
  promotion_min_episodes: 100
  promotion_consecutive_evals: 2
  promotion_fast_consecutive_evals: 2
  promotion_margin: 0.10
  save_replay_on_checkpoint: true

  # [N3-4] Fraction of the OLDEST valid replay windows to invalidate on each
  # curriculum promotion. 0.0 = off (baseline). Applies to ALL promotions.
  replay_flush_frac_on_promotion: 0.0

  # [N4-2] PRE-REGISTERED flush for hazard-distribution shifts: applied
  # (max'd with the value above) when promotion ENTERS a stage with MORE
  # static obstacles than the previous stage, or where dynamic obstacles
  # first appear. Rationale: entering stage 3 with ~300k transitions of
  # obstacle-free flight means the lidar block was uniformly maxed in the
  # data dominating the buffer — the critic and the shared lidar conv would
  # train mostly on a constant feature exactly when it becomes informative.
  # This decision is registered NOW (before stage 3 is reached) so a
  # post-promotion dip gets a planned response, not an ad-hoc one.
  # Set 0.0 to disable and recover exact v3 behavior.
  replay_flush_frac_on_obstacle_shift: 0.3

  # [N3-7] Overestimation control. Both default OFF -> identical critic learning
  # to the validated baseline. Enable for later (sparse-success, -30 terminal)
  # stages if eval/q_gap_signed is persistently POSITIVE beyond
  # q_divergence_warn (see [N4-1] in train.py).
  twin_critic: false           # TD3-style clipped double-Q (min of two targets)
  target_policy_noise: 0.0     # std of clipped noise added to target actions
  target_noise_clip: 0.2       # clip range for that noise (only used if >0)

  tail_pad: null               # [B1] null -> seq_len+burn_in-1 (uniform coverage).
                               # Lower (e.g. 40) to retain more episodes if churn hurts.

  # [N4-1] Threshold on the SIGNED, state-matched gap
  # (q_eval_start - realized_return). Escalation/warning fires ONLY on the
  # positive side (overestimation). Large NEGATIVE gaps are logged as info:
  # they indicate the critic lagging a fast-improving policy, which the
  # 2026-06-11 stage-1 run demonstrated is the normal transient (gap was
  # -18.9 at ep 199 while the old abs() diagnostic mislabelled it
  # "overestimation").
  q_divergence_warn: 15.0

network:
  fc_angle_units:  8
  fc_goal_units:   8
  actor_lstm_hidden: 128
  critic_lstm_hidden: 128
